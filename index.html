<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Marching towards curing the cancer of humanity.">
<title>T.I.N.G</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background-color: #222;
  color: #eee;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
}
.wrap {
  width: 100%;
  max-width: 640px;
  padding: 3rem 2rem 10%;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}
.btn-wrap { margin-bottom: 6rem; }
.btn {
  font-family: 'Libre Baskerville', serif;
  font-size: 13px;
  padding: 8px 20px;
  cursor: pointer;
  border-radius: 6px;
  background: transparent;
  color: #999;
  border: 1px solid #444;
  transition: background 0.2s;
}
.btn:hover { background: #333; }
.qt {
  font-family: 'Libre Baskerville', serif;
  font-size: 1.35rem;
  line-height: 1.75;
  font-style: italic;
  color: #eee;
  margin-bottom: 1rem;
  max-width: 640px;
  width: 100%;
}
.au {
  font-family: 'Libre Baskerville', serif;
  font-size: 0.9rem;
  color: #999;
  max-width: 640px;
  width: 100%;
}
.fade { animation: fi 0.35s ease; }
@keyframes fi { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
.error { font-family: 'Libre Baskerville', serif; font-size: 0.85rem; color: #a66; font-style: italic; }
</style>
</head>
<body>
<div class="wrap">
  <div class="btn-wrap">
    <button class="btn" onclick="showNext()">Refresh</button>
  </div>
  <p class="qt" id="qt">Loading…</p>
  <p class="au" id="au"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ── CONFIG ── Replace these two values with your own from supabase.com > Project Settings > API
const SUPABASE_URL = 'https://owmxhodijcgzuqbqknov.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_8Bl9vucM-rbT37MOsg55Zw_PgHcmOmi';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let quotes = [];
let lastIdx = -1;

async function init() {
  const { data, error } = await sb.from('quotes').select('id, text, author').order('id');
  if (error || !data?.length) {
    document.getElementById('qt').textContent = 'Could not load quotes.';
    document.getElementById('qt').classList.add('error');
    document.getElementById('au').textContent = error?.message || 'No quotes found.';
    return;
  }
  quotes = data;
  showNext();
}

function showNext() {
  if (!quotes.length) return;
  let i;
  do { i = Math.floor(Math.random() * quotes.length); } while (i === lastIdx && quotes.length > 1);
  lastIdx = i;
  const qtEl = document.getElementById('qt');
  qtEl.classList.remove('fade'); void qtEl.offsetWidth; qtEl.classList.add('fade');
  qtEl.textContent = '\u201C' + quotes[i].text + '\u201D';
  document.getElementById('au').textContent = '\u2014 ' + quotes[i].author;
}

init();
</script>
</body>
</html>
